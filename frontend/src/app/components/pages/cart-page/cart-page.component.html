<app-title title="Cart Page" marging="1.5rem 0 0 2.5rem"></app-title>
<app-not-found 
[visible]="!cart || !cart.items.length"
notFoundMessage="Cart page is empty"
resetLinkText="Go to HomePage"></app-not-found>
<div *ngIf="cart && cart.items.length" class="container">
    <ul>
        <li *ngFor="let cartItem of cart.items">
            <div>
                <img [src]="cartItem.food.imageUrl" [alt]="cartItem.food.name">
            </div>
            <div>
                <a href="/food/{{cartItem.food.id}}" >
                    {{cartItem.food.name}}
                </a>
            </div>
            <div>
                <select #quantitySelected 
                [value]="cartItem.quantity" 
                (change)="changeQuantity(cartItem, quantitySelected.value)">
                    <option *ngFor="let quantity of [1, 2, 3, 4, 5]" 
                    [value]="quantity">
                        {{quantity}}
                    </option>
                </select>
             </div>
             <div>
                {{cartItem.food.price | currency}}
             </div>
             <div >
                <button class="remove-button" (click)="removeFromCarT(cartItem)">
                    <i class="fa-solid fa-trash"></i> Remove
                </button>
             </div>
        </li>
    </ul>
    <div class="checkout">
        <div>
            <div class="foods-count">{{cart.totalCount}}</div>
            <div class="total-price">{{cart.totalPrice|currency}}</div>
        </div>
        <a href="/checkout"> Proceed to checkout</a>
    </div>
</div>
