<app-not-found 
[visible]="!food.id"
notFoundMessage="Food not found"
resetLinkText="Go to HomePage">
</app-not-found>

<div *ngIf="food.id" class="container">
    <img [src]="food.imageUrl" [alt]="food.name">
    <div class="details">
        <div class="header">
            <span class="name">
                {{food.name}} 
            </span>
            <span class="favorite {{food.favorite?'':'not'}}">❤</span>
        </div>
            <div class="origin">
                <span *ngFor="let origin of food.origins">
                    {{origin}}
                </span>
            </div>
            <div class="tags">
                <a *ngFor="let tag of food.tags" href="/tag/{{tag}}">
                    {{tag}}
                </a>
            </div>
            <div class="cook-time">
                <span>🕒</span>
                Cook time about <strong> {{food.cookTime}}</strong> minutes  
            </div>
            <div class="price">
                <span>
                    {{food.price | currency}}
                </span>
            </div>
            <button (click)="addToCart()" class="btn">
                Add to cart</button>
</div>
