<app-search></app-search>
<app-tag></app-tag>
<app-not-found 
[visible]="!foods || !foods.length"
notFoundMessage="Foods not found"
resetLinkText="Go to HomePage">
</app-not-found>
<ul >
    <li *ngFor="let food of foods">
        <a href="/food/{{food.id}}">
            <img [src]="food.imageUrl" [alt]="food.name">
            <div class="content">
                <div class="name">
                    {{food.name}}
                </div>
                <span class="favorite {{food.favorite?'':'not'}}">
                    ❤
                </span>
               
                <div class="product-item-footer">
                    <div class="origin">
                        <span *ngFor="let origin of food.origins">
                            {{origin}}
                        </span>
                    </div>
                    <div class="cook-time">
                        <span>🕒</span>
                        {{food.cookTime}}
                      </div>

                      <div class="price">
                        <span>
                          {{food.price | currency}}
                        </span>
                      </div>
                </div>
            </div>
        </a>
    </li>
</ul>
